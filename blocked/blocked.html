<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Time Limit</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Screen Time</p>
      <div class="icon" id="icon">⏱</div>
      <h1 id="title">Time Limit</h1>
      <p class="lead" id="lead">This website is blocked for the rest of today.</p>
      <dl>
        <div>
          <dt>Used today</dt>
          <dd id="used">—</dd>
        </div>
        <div>
          <dt>Available again</dt>
          <dd id="until">—</dd>
        </div>
      </dl>
      <p class="countdown" id="countdown"></p>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
